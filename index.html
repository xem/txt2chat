<!doctype html>
<title>txt2chat</title>
<h2>txt2chat</h3>
<h3>Displays dumps of Whatsapp dialogs (in txt) into pretty chat bubbles</h3>
<textarea id=input placeholder="paste text here" rows=15 cols=60>08/02/2025, 20:36 - Maxime: Coucou 😜
08/02/2025, 20:37 - Séverine: Heyy 😀

08/03/2025, 20:36 - Maxime: je vais écrire un long texte pour vérifier que le retour à la ligne fonctionne bien: héhéhéhéhéhéhéhéhéhéhéhéhéhé - ça a l'air d'aller.
08/03/2025, 20:37 - Séverine: ouiii!</textarea>
<p>Who is on the right? <input id=right value=Maxime>
<p><button id=go>GO</button>
<br><br>
<p><div id=out></div>
<script>
go.onclick = () => {
  out.innerHTML = "";
  var html = "";
  var txt = input.value.split("\n");
  var index = 0;
  var index2 = 0;
  var part1, part2, part3;
  console.log(txt);
  for(i in txt){
    html += "<br>";
    if(txt[i]){
      console.log(txt[i])
      index = txt[i].indexOf('-');
      part1 = txt[i].slice(0,index).trim();
      part2 = txt[i].slice(index+1);
      console.log(part1, part2);
      index2 = part2.indexOf(':');
      part3 = part2.slice(index2+1).trim();
      part2 = part2.slice(0,index2).trim();
      console.log(txt[i])
      html += "<div class='bubble " + (part2 == right.value ? "right" : "left") + "'><span class=s1>" + part2 +"</span><span class=s2>" + part1.replace(",","") +"</span><div class=s3>" + part3 +"</span></div></div>";
    }
    else {
      html += "";
    }
  }
  out.innerHTML = html;
}
</script>

<style>
body { font-family: Calibri }
#out { border: 1px solid; background: #eefbff; padding: 10px; width: 400px; min-height: 20px; overflow: auto; }
.bubble, br { background: #fff; clear: both; padding: 2px 5px 5px; margin: 3px; border-radius: 10px; border: 1px solid; max-width: 350px; min-width: 200px; line-height: 11px; font-size: 12px}
.s1 { font-weight: bold }
.s2 { color: #888; margin: 0 0 0 5px }
.left { float: left; background: #fcfcfc;     border-bottom-left-radius: 0; }
.right { float: right; background: #ebffe9;     border-bottom-right-radius: 0; }
</style>
